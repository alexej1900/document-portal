# Basic `dependabot.yml` file with minimum configuration for two package managers

version: 2
updates:
    # Enable version updates for npm
    - package-ecosystem: 'npm'
      # Look for `package.json` and `lock` files in the `root` directory
      directory: '/'
      # Check the npm registry for updates
      schedule:
          interval: 'weekly'
      groups:
          # vitest and its plugins should be updated together, otherwise tests may break
          vitest:
              patterns: ['vitest', '@vitest/*']
          nestjs:
              patterns: ['@nestjs/*']
          # minor and patch updates — one PR, not ten
          minor-and-patch:
              update-types: ['minor', 'patch']
      ignore:
          # types Node should match Node 24 from .nvmrc
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
          # TypeScript 7 does not yet support typescript-eslint and Nest CLI
          - dependency-name: 'typescript'
            update-types: ['version-update:semver-major']

    # Enable version updates for GitHub Actions
    - package-ecosystem: 'github-actions'
      # Workflow files stored in the default location of `.github/workflows`
      directory: '/'
      schedule:
          interval: 'weekly'
